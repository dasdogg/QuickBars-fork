name: Testvariante bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Platzhalter: Die App stürzt ohne Wert beim Start ab. Käufe und Plus funktionieren in diesem Bau nicht.
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug -PREVENUECAT_API_KEY='"kein_kauf_in_eigenem_bau"'
      - uses: actions/upload-artifact@v4
        with:
          name: quickbars-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
