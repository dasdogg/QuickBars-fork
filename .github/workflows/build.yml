name: Testvariante bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Fester Schluessel, damit Updates ohne Neuinstallation gehen. Nur fuer die Installation per ADB gedacht.
      - run: test -f haus.keystore || keytool -genkeypair -keystore haus.keystore -storepass hauszuhause -keypass hauszuhause -alias haus -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Haus"
      # Platzhalter: Die App stürzt ohne Wert beim Start ab. Käufe und Plus funktionieren in diesem Bau nicht.
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleProfileable -PREVENUECAT_API_KEY='"kein_kauf_in_eigenem_bau"' -Pandroid.injected.signing.store.file=$PWD/haus.keystore -Pandroid.injected.signing.store.password=hauszuhause -Pandroid.injected.signing.key.alias=haus -Pandroid.injected.signing.key.password=hauszuhause
      - uses: actions/upload-artifact@v4
        with:
          name: quickbars-schlank
          path: |
            app/build/outputs/apk/profileable/*.apk
            haus.keystore
          retention-days: 14
